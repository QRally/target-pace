<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Pace v1.3 - Rovanperä Edition</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #delta-display {
            font-size: 9rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            margin: 0;
            line-height: 1;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
        }

        #stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            margin-top: 20px;
        }

        .stat-card {
            background: #111;
            border: 1px solid #222;
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .controls { margin-top: 30px; text-align: center; }

        input {
            background: #111;
            border: 2px solid #333;
            color: #4CAF50;
            font-size: 2rem;
            padding: 10px;
            border-radius: 10px;
            width: 120px;
            text-align: center;
        }

        button {
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        #start-btn { background: #4CAF50; color: white; }
        #reset-btn { background: #333; color: #ff4444; display: none; }
        
        .on-pace { color: #4CAF50; }
        .too-fast { color: #f44336; } 
        .too-slow { color: #2196F3; } 
    </style>
</head>
<body>

    <div id="setup-ui">
        <div class="label">Target Avg Speed</div>
        <input type="number" id="speed-input" value="80.7" step="0.1">
        <div class="label" style="margin-top:10px;">MPH</div>
    </div>

    <div id="delta-display">0.0</div>
    <div class="label">Seconds Delta</div>

    <div id="stats-grid">
        <div class="stat-card">
            <div class="label">Live</div>
            <span id="live-speed" class="stat-value">0.0</span>
        </div>
        <div class="stat-card">
            <div class="label">Avg</div>
            <span id="avg-speed" class="stat-value">0.0</span>
        </div>
        <div class="stat-card">
            <div class="label">Miles</div>
            <span id="total-dist" class="stat-value">0.00</span>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="init()">START STAGE</button>
        <button id="reset-btn" onclick="location.reload()">RESET</button>
    </div>

    <script>
        let watchID, startTime, wakeLock = null;
        let totalMiles = 0, lastCoords = null;
        let targetMPH = 80.74;

        // Prevention of screen sleep
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error("Wakelock failed:", err.message);
            }
        }

        function init() {
            targetMPH = parseFloat(document.getElementById('speed-input').value);
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'block';
            
            requestWakeLock();

            navigator.geolocation.getCurrentPosition(pos => {
                startTime = Date.now();
                lastCoords = pos.coords;
                watchID = navigator.geolocation.watchPosition(update, null, {enableHighAccuracy: true});
            });
        }

        function update(pos) {
            const now = Date.now();
            const elapsedHrs = (now - startTime) / 3600000;
            const elapsedSecs = (now - startTime) / 1000;

            const d = calcDist(lastCoords.latitude, lastCoords.longitude, pos.coords.latitude, pos.coords.longitude);
            totalMiles += d;
            lastCoords = pos.coords;

            // Calculations
            const currentAvg = totalMiles / elapsedHrs;
            const targetSecs = (totalMiles / targetMPH) * 3600;
            const delta = (targetSecs - elapsedSecs).toFixed(1);

            // UI Updates
            const deltaEl = document.getElementById('delta-display');
            deltaEl.innerText = (delta > 0 ? "+" : "") + delta;
            
            if (Math.abs(delta) < 1.0) deltaEl.className = 'on-pace';
            else if (delta < 0) deltaEl.className = 'too-slow';
            else deltaEl.className = 'too-fast';

            document.getElementById('live-speed').innerText = (pos.coords.speed ? (pos.coords.speed * 2.23694).toFixed(1) : "0.0");
            document.getElementById('avg-speed').innerText = currentAvg.toFixed(1);
            document.getElementById('total-dist').innerText = totalMiles.toFixed(2);
        }

        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // Earth radius in miles
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
